[project]
name = "agent-isolation"
version = "0.1.0"
description = "A dedicated unprivileged host account for coding agents, with ACLs, a journal and rollback."
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"
dependencies = [
  # Pinned: the elevated half imports these, so a floating version is a dependency
  # the root half could get a different copy of than the plan it just computed.
  "click>=8.1,<9",
  "pydantic>=2.6,<3",
  # The declarative half's runner. It lives in THIS venv so `sudo` re-executes
  # installed code rather than anything on the caller's PATH (issue #5).
  "ansible-core==2.21.5",
]

[project.scripts]
agent-account = "agent_isolation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_isolation"]
